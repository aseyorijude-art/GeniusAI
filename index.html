<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeniusAI - 100% Free Forever</title>
    <style>
        body { font-family: sans-serif; background: #0d1117; color: #c9d1d9; display: flex; flex-direction: column; height: 100vh; margin: 0; }
        #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .box { padding: 12px; border-radius: 6px; max-width: 80%; }
        .user { background: #238636; align-self: flex-end; color: white; }
        .ai { background: #161b22; align-self: flex-start; border: 1px solid #30363d; }
        #bar { display: flex; padding: 15px; background: #161b22; gap: 10px; border-top: 1px solid #30363d; }
        input { flex: 1; padding: 12px; border: 1px solid #30363d; border-radius: 6px; background: #0d1117; color: white; }
        button { padding: 12px 24px; border: none; border-radius: 6px; background: #238636; color: white; font-weight: bold; cursor: pointer; }
        button:disabled { background: #21262d; color: #8b949e; }
    </style>
</head>
<body>

    <div id="chat">
        <div class="box ai">Welcome to GeniusAI! Ask me anything completely free.</div>
    </div>

    <div id="bar">
        <input type="text" id="msgInput" placeholder="Ask a question..." onkeypress="if(event.key==='Enter') sendToAI()">
        <button id="btn" onclick="sendToAI()">Send</button>
    </div>

    <script>
    // Paste your free GitHub token below
    const GITHUB_TOKEN = "PASTE_YOUR_GITHUB_TOKEN_HERE";

    async function sendToAI() {
        const input = document.getElementById("msgInput");
        const button = document.getElementById("btn");
        const chat = document.getElementById("chat");
        const text = input.value.trim();
        
        if (!text) return;
        input.value = "";

        chat.innerHTML += `<div class="box user">${text}</div>`;
        chat.scrollTop = chat.scrollHeight;

        button.innerText = "Thinking...";
        button.disabled = true;

        try {
            const response = await fetch("https://azure.com", {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${GITHUB_TOKEN}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    model: "meta-llama-3-8b-instruct",
                    messages: [{ role: "user", content: text }]
                })
            });

            const data = await response.json();
            const reply = data.choices[0].message.content;
            chat.innerHTML += `<div class="box ai">${reply}</div>`;
        } catch (error) {
            chat.innerHTML += `<div class="box ai">Error connecting to the free server. Please try again.</div>`;
        }

        chat.scrollTop = chat.scrollHeight;
        button.innerText = "Send";
        button.disabled = false;
    }
    </script>
</body>
</html>
